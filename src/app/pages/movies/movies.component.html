<app-header (param)="getMovieParam($event)"></app-header>

<span class="requestStatus" [ngClass]="requestStatus.length > 0 ? 'visible' : ''"><i class="fa-regular fa-circle-xmark"></i>{{requestStatus}}</span>

<div class="movie-card-container" *ngFor="let movie of movie$">    
    <div class="movie-general-data">
        <img class="movie-poster" [src]="movie.Poster" alt="">
        <div class="movie-info">
            <p class="movie-title">{{movie.Title}}</p>
            <div class="movie-time">
                <span>{{movie.Year}}</span>
                <span> &#8226; &nbsp; {{movie.Rated}}</span>
                <span> &#8226; &nbsp; {{movie.Runtime}}</span>
                <span class="lang">{{movie.Language}}</span>
            </div>
            <div class="movie-rating">
                <i class="fa-solid fa-star"></i>{{movie.imdbRating | number:'1.0-1'}}
            </div>
            <div class="movie-genre">
                <span *ngFor="let genre of movie.Genre.split(',')">{{genre}}</span>
            </div>
            <div class="movie-plot">                
                <p class="plot">{{movie.Plot}}</p>
            </div>
        </div>        
    </div>
    <div class="movie-details">
        <p class="detail">&#xe131;: {{movie.Director}}</p>
        <p class="detail">&#xf0c0;: {{movie.Actors}}</p>
        <p class="detail">&#xf091;: {{movie.Awards}}</p>
    </div>    
</div>
